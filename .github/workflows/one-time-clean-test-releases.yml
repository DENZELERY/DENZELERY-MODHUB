# ONE-TIME MAINTENANCE: after completion, this workflow file is deleted.
name: One-time cleanup MODHUB test releases
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-clean-test-releases.yml
permissions:
  contents: write
jobs:
  remove-known-tests:
    if: github.event.head_commit.message == 'One-time cleanup of three known MODHUB test releases'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate catalog and exact obsolete release identities, then delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DENZELERY/DENZELERY-MODHUB
        run: |
          set -euo pipefail
          root='repos/DENZELERY/DENZELERY-MODHUB'
          catalog="$(gh api "$root/contents/catalog/catalog.json" --jq .content | base64 --decode)"
          [[ "$catalog" == '[]' ]] || { echo 'The catalog is not empty. ABORT.'; exit 1; }
          if gh api "$root/contents/updates/hub-update.json" >/dev/null 2>&1; then
            echo 'New update manifest exists. ABORT.'; exit 1
          fi
          tags=('free-e100_the_long_road-v1.0.0' 'free-e100_the_long_road-v1.1.0' 'hub-v0.1.4')
          ids=('414213799' '416801877' '416769218')
          assets=('e100_the_long_road-1.0.0-4b93c307ac171abd.zip' 'e100_the_long_road-1.1.0-41fa06029f742248.zip' 'DENZELERY-MODHUB-Setup-v0.1.4-win-x64.exe')
          for i in 0 1 2; do
            release="$(gh api "$root/releases/tags/${tags[$i]}")"
            [[ "$(jq -r '.id' <<<"$release")" == "${ids[$i]}" ]] || { echo "Unexpected release id for ${tags[$i]}"; exit 1; }
            [[ "$(jq -r '.tag_name' <<<"$release")" == "${tags[$i]}" ]] || { echo 'Unexpected tag'; exit 1; }
            [[ "$(jq -r '.draft' <<<"$release")" == 'false' ]] || { echo 'Unexpected draft'; exit 1; }
            [[ "$(jq -r '.assets | length' <<<"$release")" == '1' ]] || { echo 'Unexpected number of assets'; exit 1; }
            [[ "$(jq -r '.assets[0].name' <<<"$release")" == "${assets[$i]}" ]] || { echo 'Unexpected asset'; exit 1; }
          done
          echo 'Validated three exact obsolete test releases. Deleting.'
          for i in 0 1 2; do
            gh api --method DELETE "$root/releases/${ids[$i]}"
            gh api --method DELETE "$root/git/refs/tags/${tags[$i]}"
            echo "Removed ${tags[$i]}"
          done
          echo 'One-time cleanup completed.'
